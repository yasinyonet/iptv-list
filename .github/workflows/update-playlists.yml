
name: Update IPTV Playlists

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-playlists
  cancel-in-progress: false

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download and validate playlists
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p stream
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          download_playlist() {
            local url="$1"
            local filename="$2"
            local temp_file="$TMP_DIR/$filename"

            echo "Downloading: $filename"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              --output "$temp_file" \
              "$url"

            if [[ ! -s "$temp_file" ]]; then
              echo "::error::Empty file: $filename"
              return 1
            fi

            if ! head -n 5 "$temp_file" |
              tr -d '\r' |
              grep -Eiq '^[[:space:]]*#EXTM3U([[:space:]]|$)'; then
              echo "::error::Invalid M3U header: $filename"
              return 1
            fi

            if ! grep -aqE '^#EXTINF([:,[:space:]])' "$temp_file"; then
              echo "::error::No channel entries: $filename"
              return 1
            fi
          }

          download_playlist \
            "https://onureroz.com/indirmeler/turk/index.m3u" \
            "turk_tv.m3u"

          download_playlist \
            "https://onureroz.com/indirmeler/turk/all.m3u" \
            "turk_all.m3u"

          download_playlist \
            "https://onureroz.com/indirmeler/turk/karma-index.m3u" \
            "karma.m3u"

          download_playlist \
            "https://onureroz.com/indirmeler/dunya/index.m3u" \
            "dunya.m3u"

          # Install only after all four downloads are validated.
          for filename in \
            turk_tv.m3u \
            turk_all.m3u \
            karma.m3u \
            dunya.m3u
          do
            install -m 644 "$TMP_DIR/$filename" "stream/$filename"
            echo "Ready: stream/$filename"
          done

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git add -- \
            stream/turk_tv.m3u \
            stream/turk_all.m3u \
            stream/karma.m3u \
            stream/dunya.m3u

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update IPTV playlists"
          git push
